services:
  - type: web
    name: brain-tumor-backend
    env: python
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn main:socket_app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        value: postgresql+asyncpg://postgres:Venky%40050805@db.xhqqktsoevhwuweybnxt.supabase.co:5432/postgres
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://braintumordetection-ten.vercel.app", "http://localhost:5173"]'
      - key: GEMINI_API_KEY
        sync: false  # Get free at: https://aistudio.google.com/app/apikey
      - key: HF_API_KEY
        sync: false  # Get free at: https://huggingface.co/settings/tokens
      - key: CLOUDINARY_URL
        sync: false  # Get free at: https://cloudinary.com
